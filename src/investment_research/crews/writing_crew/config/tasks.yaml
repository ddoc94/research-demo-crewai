writing_task:
  description: >
    A company profile in markdown, under 500 words from the verified findings below:

    {verified_findings}

    Each section begins with a markdown heading on its own line, in this order:
    ## Overview
    ## Company Summary
    ## Recent Developments
    ## What Could Not Be Determined

    Under Overview, five or six sentences of prose.

    Under Company Summary, each field on its own line, in capitals, with no bullets and
    no markdown emphasis:
    COMPANY NAME: value
    YEAR FOUNDED: value
    PRIMARY INDUSTRY: value
    HEADQUARTERS COUNTRY: value
    PUBLIC OR PRIVATE: value
    PRODUCTS/SERVICES: value

    Under Recent Developments, each finding as a single sentence with its source URL,
    then a line containing only COMPANY-ISSUED or INDEPENDENT, then a blank line before
    the next finding. Do not append source names, dates, or provenance to the sentence
    itself. Omit any finding the verification marked NOT ESTABLISHED.

    Under What Could Not Be Determined, one short line per item.
  expected_output: >
    A company profile in markdown with these sections: Overview, Company Summary,
    Recent Developments, and What Could Not Be Determined.
  agent: writer